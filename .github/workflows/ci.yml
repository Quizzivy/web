name: CI

# How this workflow decides what to run is in docs/ci.md. In short: Plan
# hashes the files each job reads, and a job is skipped when its newest marker
# for that hash is a pass. Every job checks out only those files, so the hash
# covers everything the job can see. Each job ends by recording its outcome.
on:
  pull_request:
  push:
    branches: [main, develop, "work/**"]

# A newer push supersedes an in-flight run on the same pull request. On a
# branch a run in progress is never cancelled, but runs go one at a time and
# only the newest waiting one is kept: a push that arrives while another
# waits replaces it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# packages: read lets the workflow token install @quizzivy/sdk from GitHub
# Packages (web/.npmrc); the package must grant this repository read access.
permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: "24"
  # 11.12.0 is a release pnpm itself refuses to install
  # (ERR_PNPM_BROKEN_PNPM_RELEASE): its @pnpm/exe build shipped without a
  # binary -- 16KB unpacked against 18MB for a real one.
  PNPM_VERSION: "11.25.0"
  # E2E (live API) builds Quizzivy/api at the commit in api-ref.
  GO_VERSION: "1.27"
  API_REPOSITORY: Quizzivy/api

jobs:
  # ------------------------------------------------------------------- plan
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the plan
        run: node --test "scripts/ci/tests/*.test.mjs"

      - name: Decide which jobs run
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan.mjs

  # ------------------------------------------------------------------- deck
  deck:
    name: Deck
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs.deck.run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs.deck) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node scripts/check-design-deck.mjs

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # ------------------------------------------------------------- web checks
  web-check:
    name: Web checks
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['web-check'].run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['web-check']) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}
          token: ${{ github.token }}

      # A release ships against an API that serves a released contract, so a
      # pull request into main pins the X.Y.Z the owner tagged in Quizzivy/sdk,
      # never a -dev build of develop (D-081).
      - name: A release pins a released SDK
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        working-directory: web
        run: |
          pinned=$(node -p "require('./package.json').dependencies['@quizzivy/sdk']")
          [[ $pinned =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::web/package.json pins @quizzivy/sdk '$pinned', not a release X.Y.Z"; exit 1; }

      # §2: "CI fails on lint errors."
      - name: Lint
        working-directory: web
        run: pnpm lint:ci

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Format check
        working-directory: web
        run: pnpm format:ci

      - name: Integration tests
        working-directory: web
        run: pnpm test:integration

      - name: Build
        working-directory: web
        run: pnpm build

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # --------------------------------------------------------- web unit tests
  # Split into shards because the suite is the longest single step on the web
  # side. scripts/ci/plan.mjs sets the number of shards. The name carries no
  # expression: GitHub appends the shard itself, and a skipped job would show
  # an expression unexpanded.
  web-unit:
    name: Web unit
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['web-unit'].run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.plan).jobs['web-unit'].shards }}
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['web-unit']) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}
          token: ${{ github.token }}

      - name: Unit tests
        working-directory: web
        run: pnpm test:unit --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[strategy.job-index][job.status] }}

  # -------------------------------------------------------------------- e2e
  e2e:
    name: E2E
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs.e2e.run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs.e2e) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}
          token: ${{ github.token }}

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer runs `pnpm build && pnpm preview`, so this
      # exercises a real production build rather than the dev server.
      - name: Run Playwright
        working-directory: web
        run: pnpm e2e

      - name: Run content editor prototype
        working-directory: web
        run: pnpm e2e:content

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          overwrite: true

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # --------------------------------------------------------------- e2e-live
  # The one browser suite that talks to a real API (§14), because its claims
  # are about the two halves meeting: E2E 1a uploads a real mp3 so the §11.1
  # sniff, size check and duration probe run rather than being mocked.
  #
  # Separate from `e2e` so the stubbed suite stays independent of postgres,
  # MinIO and a Go build. The API, its migrations, seed, MinIO and the Word
  # converter come from Quizzivy/api at the commit api-ref names, checked out
  # beside this repository; its scripts run from there because they resolve
  # their paths from the working directory.
  e2e-live:
    name: E2E (live API)
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['e2e-live'].run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18  # Docker Hub's pull limit; docs/ci.md
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['e2e-live']) }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATE_URL: postgres://quizzivy_migrate:migrate@localhost:5432/quizzivy?sslmode=disable
      DATABASE_URL: postgres://quizzivy_app:app@localhost:5432/quizzivy?sslmode=disable
      APP_ENV: development
      API_PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      JWT_SIGNING_KEY: e2e-live-signing-key-not-a-secret-32b
      # base64 of "e2e-live-join-code-key-not-secre", 32 bytes. Throwaway.
      JOIN_CODE_KEY: ZTJlLWxpdmUtam9pbi1jb2RlLWtleS1ub3Qtc2VjcmU=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: quizzivy-media
      S3_ACCESS_KEY_ID: quizzivy
      S3_SECRET_ACCESS_KEY: quizzivy-dev-secret
      # MinIO is addressed by path, not by virtual host. Without this the SDK
      # sends the bucket as a subdomain, MinIO reads the first path segment as
      # the bucket instead, and every upload fails with NoSuchBucket for a
      # bucket named "audio". .env sets it for the same reason; only R2 in
      # production leaves it unset.
      S3_FORCE_PATH_STYLE: "true"
      # Word import, as `make dev` runs it: the API queues a run and wakes the
      # worker, which docs/setup/word-import-worker.md describes. The work
      # directory and the converter image are known only at run time, so the
      # "Prepare the Word import worker" step adds them.
      IMPORT_S3_BUCKET: quizzivy-imports
      IMPORT_PROCESSING_ENABLED: "true"
      IMPORT_WORKER_WAKE_URL: http://localhost:8091/wake
      IMPORT_WORKER_WAKE_ADDR: localhost:8091
      # base64 of "e2e-live-secrets-key-not-secret!", 32 bytes. Throwaway.
      # Without it the outbox cannot seal a set-password token, and the Add
      # user the admin-console spec drives would queue no link.
      SECRETS_KEY: ZTJlLWxpdmUtc2VjcmV0cy1rZXktbm90LXNlY3JldCE=

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - name: Read the API commit
        id: api
        run: |
          ref=$(tr -d '[:space:]' < api-ref)
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "::error::api-ref holds '$ref', not a commit id"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Public today; if Quizzivy/api turns private, this needs a read-only
      # token for it in place of the workflow's.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.API_REPOSITORY }}
          ref: ${{ steps.api.outputs.ref }}
          path: api-checkout
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api-checkout/server/go.sum

      - uses: ./api-checkout/.github/actions/db-tools

      # The api repository's MinIO action, run from its checkout: the compose
      # file, docker/minio and the scripts are resolved from there. The image
      # comes from ghcr.io when this repository may read it, and is built from
      # source otherwise.
      - name: Start MinIO
        working-directory: api-checkout
        env:
          TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          image="$(scripts/ci/minio-image.sh)"
          if echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 \
            && docker pull --quiet "$image"; then
            docker tag "$image" quizzivy-minio:development
          else
            echo "::notice::$image could not be pulled; building MinIO from source"
            scripts/ci/mirror-images.sh golang:1.27-alpine alpine:3.22
            docker compose build minio
          fi
          docker compose up -d --wait minio
          docker compose run --rm minio-init

      - name: Provision roles and database
        working-directory: api-checkout
        run: ./scripts/provision-db.sh

      - name: Apply migrations and seed
        working-directory: api-checkout
        run: |
          goose -dir migrations postgres "$MIGRATE_URL" up
          for f in seed/*.sql; do psql "$MIGRATE_URL" -v ON_ERROR_STOP=1 -f "$f"; done

      # The image the Go pipeline test in the api's Server tests runs through.
      # The worker is given its id, because the converter refuses a tag, and
      # the job fails here when there is none rather than start a worker that
      # processes .docx without the page rendition.
      - name: Build the Word converter image
        id: converter
        working-directory: api-checkout
        run: |
          scripts/ci/mirror-images.sh debian:trixie-slim
          docker build --tag quizzivy-word-converter:ci docker/word-converter
          echo "image=$(docker image inspect --format '{{.Id}}' quizzivy-word-converter:ci)" >> "$GITHUB_OUTPUT"

      - name: Prepare the Word import worker
        env:
          CONVERTER_IMAGE: ${{ steps.converter.outputs.image }}
        run: |
          case "$CONVERTER_IMAGE" in
            sha256:*) ;;
            *) echo "::error::no converter image id"; exit 1 ;;
          esac
          install -d -m 0700 "$RUNNER_TEMP/import-work"
          {
            echo "IMPORT_WORK_DIR=$RUNNER_TEMP/import-work"
            echo "IMPORT_DOCKER_BINARY=$(command -v docker)"
            echo "IMPORT_CONVERTER_IMAGE=$CONVERTER_IMAGE"
          } >> "$GITHUB_ENV"

      # With no RESEND_API_KEY the API and the worker write every message to
      # EMAIL_SINK_DIR, and admin-console.live.spec.ts reads set-password links
      # back from it, so the three processes take this one path. A step sets
      # it, because a job's env cannot read the runner context.
      - name: Choose the email sink
        run: |
          install -d -m 0700 "$RUNNER_TEMP/email-sink"
          echo "EMAIL_SINK_DIR=$RUNNER_TEMP/email-sink" >> "$GITHUB_ENV"

      # Built rather than `go run`, so a compile error fails here with a clear
      # message instead of as a connection refused thirty seconds later.
      - name: Start the API
        run: |
          go -C api-checkout/server build -o "$RUNNER_TEMP/api" ./cmd/api
          "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Start the Word import worker
        run: |
          go -C api-checkout/server build -o "$RUNNER_TEMP/import-worker" ./cmd/import-worker
          "$RUNNER_TEMP/import-worker" > "$RUNNER_TEMP/import-worker.log" 2>&1 &
          worker=$!
          for _ in $(seq 1 40); do
            grep -q '"msg":"import worker started"' "$RUNNER_TEMP/import-worker.log" && exit 0
            kill -0 "$worker" 2>/dev/null || break
            sleep 1
          done
          echo "Import worker did not start"; cat "$RUNNER_TEMP/import-worker.log"; exit 1

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}
          token: ${{ github.token }}

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the live E2Es
        working-directory: web
        run: pnpm e2e:live

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

      - name: Import worker log
        if: failure()
        run: cat "$RUNNER_TEMP/import-worker.log"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-live
          path: web/playwright-report/
          retention-days: 7
          overwrite: true

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # ----------------------------------------------------------------- result
  # The one check the branch rules require. always(): a job skipped by its `if`
  # counts as passed for a required check, so this must run and fail when a
  # needed job failed, was cancelled, or never started.
  #
  # Only a pull request's run reports it under the required name. The head of
  # a pull request from main, develop or a work branch also has a push run,
  # which tests the branch and not the merge; its green result must not stand
  # in for the merge's.
  result:
    name: ${{ github.event_name == 'pull_request' && 'CI result' || 'CI result (push)' }}
    needs: [plan, deck, web-check, web-unit, e2e, e2e-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Compare what ran with the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs

  # ------------------------------------------------------------------ sonar
  # Static analysis on top of eslint and tsc, not instead of them: they stay
  # authoritative and fail fast. This adds duplication, complexity and the
  # cross-cutting rules they do not look for.
  sonar:
    name: Sonar
    needs: [plan]
    # develop only, as in Quizzivy/api: the analysis of develop is the one
    # the SonarCloud project shows.
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads git history to decide what counts as new code and to
          # attribute issues. A shallow clone silently makes every line look new.
          fetch-depth: 0

      # Skips rather than fails while SONAR_TOKEN is unset, so this job can be
      # merged before the SonarCloud project exists.
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

      - name: Say why it was skipped
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not set, so no analysis ran."
          echo "See the setup steps at the top of sonar-project.properties."
