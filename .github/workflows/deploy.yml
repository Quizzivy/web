name: Deploy

# Merging release/* into main is what ships the web. This runs AFTER CI
# concludes on main rather than on the push itself, so a merge that breaks
# something is not deployed while its own test run is still red. The API
# deploys from Quizzivy/api, and first: the web job checks that production
# already serves the SDK this build pins.
#
# Until production switches over from SekiroKenjii/Quizzivy, the repository
# variable WEB_DEPLOY is unset and nothing deploys from here. Set it to `pages`
# to deploy to Cloudflare Pages.
#
# It is a separate workflow, not a job inside CI, so a deploy that fails for an
# infrastructure reason -- an expired token -- can be re-run on its own from
# workflow_dispatch, without paying for the tests that already passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy in flight: one queued run waiting its turn is better
# than a half-uploaded site.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"
  # Where the SPA is told to find the API. Baked into the bundle at build time,
  # so it is a build input rather than runtime configuration.
  API_ORIGIN: https://api.quizzivy.com
  PAGES_PROJECT: quizzivy-web
  # The version that has deployed this project; bump deliberately.
  WRANGLER_VERSION: 3.90.0

jobs:
  # The commit CI validated, resolved once.
  #
  # workflow_run does NOT check out the triggering commit by default -- it
  # checks out the default branch's tip. On a quiet repo those are the same
  # commit and the difference never shows; on a busy afternoon it silently
  # deploys something CI never saw.
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    # event == 'push': the branch filter above matches the run's HEAD branch,
    # and the back-merge pull request from main to develop has main as its
    # head. Without this, its CI run deployed the same commit a second time.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      # A CI run that is no longer the tip of main deploys nothing. Re-running
      # an old run to green completes it again, and without this check that
      # would put an earlier release back into production.
      - id: pick
        env:
          TRIGGER: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          WEB_DEPLOY: ${{ vars.WEB_DEPLOY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          web=true
          case "${WEB_DEPLOY:-}" in
            pages) ;;
            "") echo "::notice::WEB_DEPLOY is unset: production still deploys from SekiroKenjii/Quizzivy, so nothing is deployed"; web=false ;;
            *) echo "::error::WEB_DEPLOY must be pages or unset, not '$WEB_DEPLOY'"; exit 1 ;;
          esac
          if [ "$TRIGGER" = workflow_run ]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [ "$SHA" != "$tip" ]; then
              echo "::notice::$SHA is not the tip of main ($tip); nothing is deployed"
              web=false
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA: web=$web"

  # ------------------------------------------------------------------- web
  web:
    name: Web → Cloudflare Pages
    needs: resolve
    if: needs.resolve.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check the credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          # Not a secret -- it travels in the authorization URL the browser
          # follows -- but it IS environment-specific, and a build without it
          # simply hides the Google button rather than failing, which is the
          # kind of breakage nobody reports.
          [ -n "$VITE_GOOGLE_CLIENT_ID" ] || missing="$missing VITE_GOOGLE_CLIENT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::not configured:$missing"
            echo "::error::see docs/deploy.md"
            exit 1
          fi

      # npm and pnpm read GitHub Packages' token from ~/.npmrc; the line names
      # the variable, so the token itself is never written to disk.
      - name: Registry credentials
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      # The API deploys first (Quizzivy/api), and its deploy makes the SDK it
      # serves `latest` (D-081). A web that pins a newer SDK than `latest`
      # would call operations production does not have yet, so it waits.
      - name: Check the API already serves this SDK
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(node -p "require('./package.json').dependencies['@quizzivy/sdk']")
          if ! [[ $pinned =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::web/package.json pins @quizzivy/sdk '$pinned'; a release pins the X.Y.Z the owner tagged in Quizzivy/sdk."
            exit 1
          fi
          latest=$(npm view @quizzivy/sdk dist-tags.latest)
          older=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | head -1)
          if [ "$older" != "$pinned" ]; then
            echo "::error::the web pins @quizzivy/sdk $pinned and the API in production serves $latest: deploy Quizzivy/api first."
            exit 1
          fi
          echo "web pins $pinned; production serves $latest"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      # VITE_ values are inlined at build time, so this is the step that decides
      # which API the deployed SPA talks to. There is no runtime override.
      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ env.API_ORIGIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_DEFAULT_LOCALE: vi
          VITE_ORG_NAME: ${{ vars.VITE_ORG_NAME }}
          VITE_ORG_FRONT_DESK_PHONE: ${{ vars.VITE_ORG_FRONT_DESK_PHONE }}
          VITE_ORG_FRONT_DESK_HOURS: ${{ vars.VITE_ORG_FRONT_DESK_HOURS }}
          QUIZZIVY_BUILD: ${{ needs.resolve.outputs.sha }}
        run: pnpm build

      # The check that stops the whole point of the deploy going wrong quietly.
      # client.ts falls back to http://localhost:8080 when VITE_API_BASE_URL is
      # unset, so a mis-scoped variable produces a bundle that builds, uploads,
      # serves, and cannot reach anything.
      - name: Assert the bundle points at production
        working-directory: web
        run: |
          grep -rq "$API_ORIGIN" dist/assets/*.js || {
            echo "::error::$API_ORIGIN is not in the bundle -- VITE_API_BASE_URL did not reach the build"
            exit 1; }
          echo "bundle targets $API_ORIGIN"

      - name: Assert security headers are included
        run: cmp web/public/_headers web/dist/_headers

      # A pinned direct call, with no installer between us and the deploy tool.
      # wrangler-action installed wrangler into web/ at deploy time with
      # whatever package manager it found there -- an unpinned `pnpm add` into
      # the checkout after the build had already succeeded, whose version came
      # from the action's default and whose postinstall needed an approval in
      # web/pnpm-workspace.yaml for a package this project does not depend on
      # (#47). npx has no build-script gating, the version is pinned here, and
      # nothing is written into web/.
      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
