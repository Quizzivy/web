# SonarCloud analysis. Runs in CI only -- see the `sonar` job in
# .github/workflows/ci.yml. Nothing here runs on a developer machine.
#
# BEFORE THE FIRST RUN, someone with a SonarCloud login has to:
#   1. Analyze Quizzivy/web in the quizzivy organization at https://sonarcloud.io
#      (free while the repository is public).
#   2. Turn Automatic Analysis off and choose GitHub Actions as the analysis
#      method.
#   3. Put the token it shows in the repository secret SONAR_TOKEN. Until that
#      secret exists the `sonar` job skips itself rather than failing.
#
# If SonarCloud assigns a different projectKey on import, this file is what has
# to agree with it -- the scan fails loudly on a mismatch.

sonar.projectKey=Quizzivy_web
sonar.organization=quizzivy

sonar.sourceEncoding=UTF-8

sonar.sources=web/src
sonar.tests=web/tests

sonar.exclusions=\
  web/src/lib/api/client.typecheck.ts,\
  web/src/components/ui/**

# Why each exclusion:
#   web/src/lib/api/client.typecheck.ts
#                            A type-level test that only looks like code:
#                            `tsc -b` is the assertion and there is nothing to
#                            run. Its `void _binding` lines exist to stop the
#                            compiler reporting a deliberately-unused binding,
#                            and S3735 fired on all of them. It lives in src/
#                            so that `tsc -b` covers it; the build tree-shakes
#                            it out.
#   web/src/components/ui/** Vendored shadcn primitives. Issues raised here are
#                            issues in upstream code this project does not
#                            maintain.

# Coverage is not wired up yet: it needs @vitest/coverage-v8 in
# web/package.json, `coverage: { reporter: ["lcov"] }` in vite.config.ts and
# `--coverage` on the unit-test step, then:
# sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
